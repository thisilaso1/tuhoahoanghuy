name: Build and deploy Hoai Nguyet FE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            thisilaso1/tuhoabe:${{ github.sha }}
            thisilaso1/tuhoabe:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH through the public host to the K3s VM
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST || '103.21.150.253' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER || 'nguyenquanghung' }}
          DEPLOY_VM_HOST: ${{ vars.DEPLOY_VM_HOST || secrets.DEPLOY_VM_HOST || '192.168.122.200' }}
          DEPLOY_VM_USER: ${{ vars.DEPLOY_VM_USER || secrets.DEPLOY_VM_USER || 'nguyenquanghung' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/tuhoa_deploy
          chmod 600 ~/.ssh/tuhoa_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF_SSH
          Host tuhoa-bastion
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/tuhoa_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          Host tuhoa-k3s
            HostName $DEPLOY_VM_HOST
            User $DEPLOY_VM_USER
            ProxyJump tuhoa-bastion
            IdentityFile ~/.ssh/tuhoa_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF_SSH

      - name: Roll out the pushed image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh tuhoa-k3s "KUBECONFIG=/etc/rancher/k3s/k3s.yaml /usr/local/bin/kubectl -n envitek-iot set image deployment/tu-hoa-kham-thien web=thisilaso1/tuhoabe:${IMAGE_TAG} && KUBECONFIG=/etc/rancher/k3s/k3s.yaml /usr/local/bin/kubectl -n envitek-iot rollout status deployment/tu-hoa-kham-thien --timeout=180s"
