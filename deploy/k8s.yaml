apiVersion: apps/v1
kind: Deployment
metadata:
  name: tu-hoa-kham-thien
  namespace: envitek-iot
  labels:
    app: tu-hoa-kham-thien
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tu-hoa-kham-thien
  template:
    metadata:
      labels:
        app: tu-hoa-kham-thien
    spec:
      containers:
        - name: web
          image: thisilaso1/tuhoabe:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tu-hoa-kham-thien
  namespace: envitek-iot
spec:
  type: NodePort
  selector:
    app: tu-hoa-kham-thien
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30088
